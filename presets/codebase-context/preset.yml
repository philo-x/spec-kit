schema_version: "1.0"

preset:
  id: "codebase-context"
  name: "Codebase Context"
  version: "1.1.0"
  description: "Augment planning, task generation, analysis, and implementation with optional repository context"
  author: "Local Project"
  license: "MIT"

requires:
  speckit_version: ">=1.0.1"

provides:
  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Use repository context while planning a feature"
      strategy: "replace"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Use repository context while generating tasks"
      strategy: "replace"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Check design artifacts against repository context before implementation"
      strategy: "replace"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Use repository context while implementing tasks"
      strategy: "replace"

tags:
  - "codebase"
  - "architecture"
  - "workflow"
