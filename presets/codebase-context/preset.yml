schema_version: "1.0"

preset:
  id: "codebase-context"
  name: "Codebase Context"
  version: "1.2.0"
  description: "Generate verified repository context and use it across planning, tasks, analysis, and implementation"
  author: "Local Project"
  license: "MIT"

requires:
  speckit_version: ">=1.0.1"

provides:
  templates:
    - type: "command"
      name: "speckit.codebase-context"
      file: "commands/speckit.codebase-context.md"
      description: "Generate or refresh verified repository context"
      strategy: "replace"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Use repository context while planning a feature"
      strategy: "replace"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Use repository context while generating tasks"
      strategy: "replace"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Check design artifacts against repository context before implementation"
      strategy: "replace"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Use repository context while implementing tasks"
      strategy: "replace"

    - type: "template"
      name: "codebase-context-template"
      file: "templates/codebase-context-template.md"
      description: "Stable output structure for verified repository context"
      strategy: "replace"

tags:
  - "codebase"
  - "architecture"
  - "workflow"
